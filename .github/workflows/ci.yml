name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The smoke suite runs against a real database. Without one every
    # /api/dashboard/* route answers "unavailable", which the old suite could
    # not tell apart from working — so a renamed table or a route throwing on
    # every request passed CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civiclab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civiclab_test
      # Cron routes fail closed without this; the suite asserts they reject
      # unauthenticated calls, so it must be set to something.
      CRON_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app
        run: npx tsc --noEmit

      - name: Typecheck ingest scripts
        # Excluded from the root tsconfig, so this is the only thing that
        # checks the pipelines the crons and npm scripts depend on.
        run: npx tsc -p ingest --noEmit

      - name: Lint
        run: npm run lint

      - name: Load schema and fixtures
        run: npx tsx ingest/ci-seed.ts

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
